<div class="resource-card group flex flex-col justify-between bg-surface h-full">
  <div class="flex-grow flex flex-col">
    <div class="flex items-start justify-between mb-4 gap-2">
      <div class="flex flex-wrap gap-1.5">
        {% if res.category %}
          <span class="px-2 py-0.5 text-[0.65rem] uppercase tracking-wider font-bold bg-primary-light text-primary rounded-sm">{{ res.category.name }}</span>
        {% endif %}
        <span class="px-2 py-0.5 text-[0.65rem] uppercase tracking-wider font-bold bg-bg-subtle text-secondary border border-border rounded-sm">{{ res.resource_type }}</span>
        {% if res.status and res.status != 'published' %}
          <span class="px-2 py-0.5 text-[0.65rem] uppercase tracking-wider font-bold {% if res.status == 'rejected' %}bg-danger-light text-danger border border-danger-border{% else %}bg-warning-light text-warning border border-warning-border{% endif %} rounded-sm">{{ res.status|capitalize }}</span>
        {% endif %}
      </div>
      <button class="btn-save-toggle flex-shrink-0 text-muted hover:text-danger hover:bg-danger-light p-1.5 rounded-full transition-colors flex items-center justify-center border border-transparent" data-resource-id="{{ res.id }}" title="Save">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
        </svg>
      </button>
    </div>

    <h3 class="text-lg font-bold text-brand mb-2 line-height-snug">
      <a href="/resources/{{ res.slug }}" class="hover:text-primary transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary rounded-sm">{{ res.title }}</a>
    </h3>

    <p class="text-sm text-secondary line-clamp-3 mb-4 leading-relaxed flex-grow">
      {{ res.description|striptags }}
    </p>
  </div>

  <div class="flex items-center justify-between pt-4 border-t border-border mt-auto">
    <div class="flex items-center text-xs font-semibold text-muted bg-bg px-2 py-1 rounded-md border border-border truncate max-w-[120px]">
      <i data-lucide="map-pin" class="w-3 h-3 text-muted"></i> <span class="truncate ml-1">{{ res.location }}</span>
    </div>
    <a href="/resources/{{ res.slug }}" class="text-sm font-semibold text-primary group-hover:text-primary-hover flex items-center transition-colors">
      View <span class="ml-1 opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all">&rarr;</span>
    </a>
  </div>
</div>
