{% extends "layouts/base.html" %}

{% block title %}Admin Secure Login — HelpLink{% endblock %}

{% block content %}
<div class="container" style="padding-top: 4rem; padding-bottom: 6rem; max-width: 500px; margin: 0 auto;">
  
  <div style="background: var(--color-surface); border: 1px solid var(--color-border); border-top: 4px solid var(--color-brand); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-md);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="font-size: 3rem; margin-bottom: 0.5rem;">🔐</div>
      <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--color-brand); margin-bottom: 0.25rem;">Admin Secure Access</h1>
      <p style="color: var(--color-text-secondary); font-size: 0.95rem;">Enter your administrative credentials to continue.</p>
    </div>

    {% if error %}
      <div class="alert alert-error" style="margin-bottom: 1.5rem; border-radius: var(--radius-md);">
        <strong>Error:</strong> {{ error }}
      </div>
    {% endif %}

    <form action="/admin/login" method="POST">
      <input type="hidden" name="next" value="{{ next }}">
      
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="email" style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--color-text);">Admin Email Address</label>
        <input type="email" id="email" name="email" class="form-control" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 1rem;">
      </div>

      <div class="form-group" style="margin-bottom: 2rem;">
        <label for="password" style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--color-text);">Admin Password</label>
        <input type="password" id="password" name="password" class="form-control" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 1rem;">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1.05rem; font-weight: 700;">Secure Login</button>
    </form>
    
    <div style="margin-top: 2rem; text-align: center; border-top: 1px solid var(--color-border); padding-top: 1.5rem;">
      <a href="/login" style="color: var(--color-text-secondary); text-decoration: none; font-size: 0.9rem;">&larr; Back to regular user login</a>
    </div>

  </div>
</div>
{% endblock %}
