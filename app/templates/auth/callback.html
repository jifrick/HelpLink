{% extends "layouts/base.html" %}

{% block title %}Completing Authentication — HelpLink{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 1.5rem; text-align: center;">
  <div class="form-card" style="max-width: 450px; margin: 0 auto; padding: 2.5rem 2rem;">
    <div style="margin-bottom: 1.5rem;">
      <div class="spinner" style="width: 48px; height: 48px; border: 4px solid var(--color-border); border-top-color: var(--color-primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
    </div>
    <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--color-text-primary);">Completing Google Sign-In</h2>
    <p style="color: var(--color-text-secondary); font-size: 0.95rem;">Please wait while we set up your secure session...</p>
    
    <form id="hash-form" method="POST" action="/auth/callback" style="display: none;">
      <input type="hidden" name="access_token" id="access_token_input">
      <input type="hidden" name="next" value="{{ next or '/dashboard' }}">
    </form>
  </div>
</div>

<script>
  (function() {
    const hash = window.location.hash;
    if (hash && hash.includes("access_token=")) {
      const params = new URLSearchParams(hash.substring(1));
      const accessToken = params.get("access_token");
      if (accessToken) {
        document.getElementById("access_token_input").value = accessToken;
        document.getElementById("hash-form").submit();
        return;
      }
    }
    // If no access token in hash, redirect after small delay if code parameter wasn't present
    setTimeout(function() {
      window.location.href = "/login?error=" + encodeURIComponent("Authentication flow did not return expected token.");
    }, 2500);
  })();
</script>
<style>
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
{% endblock %}
