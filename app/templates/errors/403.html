{% extends "layouts/base.html" %}

{% block title %}Access Denied — HelpLink{% endblock %}

{% block content %}
<div class="container" style="padding: 6rem 1.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh;">
  
  <div style="background: var(--color-surface); border: 1px solid var(--color-border); border-top: 4px solid var(--color-danger); border-radius: var(--radius-lg); padding: 3rem 2rem; max-width: 550px; width: 100%; text-align: center; box-shadow: var(--shadow-md);">
    
    <div style="display: flex; justify-content: center; margin-bottom: 1.5rem;">
      <div style="width: 80px; height: 80px; background: var(--color-background); border: 2px dashed var(--color-danger); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--color-danger);">
        <i data-lucide="ban" style="width: 40px; height: 40px;"></i>
      </div>
    </div>
    
    <h1 style="font-size: 2rem; font-weight: 800; color: var(--color-brand); margin-bottom: 0.5rem;">Access Denied</h1>
    
    <p style="color: var(--color-text-secondary); font-size: 1.05rem; margin-bottom: 2rem; line-height: 1.6;">
      {% if detail %}
        {{ detail }}
      {% else %}
        You do not have the required permissions to access this page.
      {% endif %}
    </p>

    <div style="display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center;">
      <a href="/dashboard" class="btn btn-primary" style="padding: 0.75rem 1.5rem;">Go to Dashboard</a>
      <a href="/" class="btn btn-outline" style="padding: 0.75rem 1.5rem;">Return Home</a>
    </div>

  </div>
</div>
{% endblock %}
